<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KemCases — задания</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#101318;color:#f4f6fb;font:16px system-ui;padding:18px}
main{max-width:560px;margin:3vh auto;background:#1b2029;border:1px solid #303846;border-radius:22px;padding:22px}
h1{margin:0 0 6px;font-size:27px}.muted{color:#aeb8c8;line-height:1.5}
.panel{padding:14px;border-radius:14px;background:#292f3b;margin:14px 0;line-height:1.5}
video{width:100%;border-radius:14px;background:#080a0e;max-height:360px}
button{width:100%;border:0;border-radius:13px;padding:14px;background:#657cf6;color:white;font-weight:700;font-size:16px;margin-top:10px}
button:disabled{opacity:.45}.item{border:1px solid #3a4352;padding:14px;border-radius:14px;margin:10px 0}
.timer{font-weight:700;text-align:center;padding:12px;background:#292f3b;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>🎬 Заработок голды</h1>
<p class="muted">Выбери активное задание и досмотри материал до конца.</p>
<div id="status" class="panel">Загружаем задания…</div>
<div id="videos"></div>
<video id="player" controls playsinline hidden></video>
<div id="timer" class="timer" hidden>Осталось: —</div>
<button id="finish" hidden disabled>Забрать голду</button>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const headers={"X-Telegram-Init-Data":tg?.initData||""};
const status=document.getElementById("status"),list=document.getElementById("videos");
const player=document.getElementById("player"),finish=document.getElementById("finish");
const timer=document.getElementById("timer");
let active=null,startedAt=0,required=0,clock=null;
function say(s){status.textContent=s}
function stopClock(){if(clock){clearInterval(clock);clock=null}}
async function load(){
 if(!tg?.initData){say("Открой Mini App через кнопку в Telegram, чтобы авторизоваться.");return}
 try{
  const r=await fetch("/api/videos",{headers});const data=await r.json();
  if(!r.ok)throw Error(data.detail||"Ошибка загрузки");
  say("Выполнено сегодня: "+data.used_today+" из "+data.daily_limit+" заданий.");
  if(!data.videos.length){list.textContent="Пока нет доступных заданий.";return}
  list.innerHTML="";
  for(const v of data.videos){
   const el=document.createElement("div");el.className="item";
   const title=document.createElement("b");title.textContent=v.title;
   const info=document.createElement("p");info.className="muted";
   info.textContent=v.duration+" сек. • награда "+Number(v.reward).toFixed(2)+" G";
   const btn=document.createElement("button");btn.textContent="Открыть задание";btn.onclick=()=>begin(v);
   el.append(title,info,btn);list.append(el);
  }
 }catch(e){say(e.message)}
}
async function begin(v){
 try{
  const r=await fetch("/api/watch/start",{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({video_id:v.id})});
  const data=await r.json();if(!r.ok)throw Error(data.detail||"Не удалось начать задание");
  stopClock();active=data.session_token;required=data.duration;startedAt=Date.now();
  player.src=v.url;player.hidden=false;timer.hidden=false;finish.hidden=false;finish.disabled=true;
  await player.play();
  say("Задание запущено. Досмотри видео и дождись окончания таймера.");
  clock=setInterval(()=>{
   const remaining=Math.max(0,Math.ceil(required-(Date.now()-startedAt)/1000));
   timer.textContent=remaining>0?"Осталось: "+remaining+" сек.":"Таймер завершён";
   if(remaining===0&&player.ended){finish.disabled=false;stopClock()}
  },250);
 }catch(e){say(e.message)}
}
finish.onclick=async()=>{
 if(!active)return;
 try{
  finish.disabled=true;
  const r=await fetch("/api/watch/complete",{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({session_token:active})});
  const data=await r.json();if(!r.ok)throw Error(data.detail||"Не удалось подтвердить задание");
  say("Начислено "+Number(data.reward).toFixed(2)+" G. Новый баланс: "+Number(data.balance).toFixed(2)+" G.");
  active=null;stopClock();finish.hidden=true;timer.hidden=true;player.hidden=true;player.pause();load();
 }catch(e){say(e.message);finish.disabled=false}
};
load();
</script>
</main>
</body>
</html>
